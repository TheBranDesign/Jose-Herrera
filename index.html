<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>FixMate — Home Services</title>
<style>
:root{--blue:#3568e9;--blue2:#214dc2;--navy:#132344;--ink:#202c43;--muted:#8290a5;--line:#edf0f5;--canvas:#f6f7f9;--green:#20ad59;--shadow:0 18px 55px rgba(24,42,75,.2)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100vh;background:radial-gradient(circle at 18% 8%,#e6edff 0,transparent 32%),linear-gradient(135deg,#f4f6fb,#e9edf5);display:grid;place-items:center;padding:24px}
.stage{width:100%;display:grid;place-items:center}.phone{width:375px;height:min(812px,calc(100vh - 32px));min-height:620px;background:#fff;border:8px solid #17191e;border-radius:49px;box-shadow:var(--shadow),inset 0 0 0 1px #687080;position:relative;overflow:hidden;isolation:isolate}.phone:before{content:"";position:absolute;z-index:20;top:0;left:50%;transform:translateX(-50%);width:112px;height:24px;background:#08090c;border-radius:0 0 17px 17px}.phone:after{content:"";position:absolute;pointer-events:none;inset:0;border-radius:41px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);z-index:19}
.status{height:37px;padding:8px 23px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:11px;font-weight:800;background:#fff;position:relative;z-index:2}.status .sys{letter-spacing:1px}.app{height:calc(100% - 37px);background:var(--canvas);overflow-y:auto;scrollbar-width:none;padding-bottom:82px}.app::-webkit-scrollbar{display:none}.topbar{height:62px;padding:8px 18px;background:#fff;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:850;color:var(--navy)}.logo{width:34px;height:34px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:19px}.top-actions{display:flex;gap:9px}.round{width:35px;height:35px;border:0;border-radius:50%;background:#f4f6fa;color:#25334c;font-size:17px;display:grid;place-items:center;cursor:pointer}.page{display:none;padding:15px 17px 24px;min-height:100%}.page.active{display:block}.welcome{display:flex;justify-content:space-between;align-items:center;margin:0 0 15px}.welcome h1{font-size:19px;line-height:1.2;margin:0;color:var(--navy)}.welcome p{font-size:12px;color:var(--muted);margin:4px 0 0}.hero{min-height:151px;border-radius:21px;background:linear-gradient(112deg,#3164e8,#3e77f2);color:#fff;padding:19px 16px;position:relative;overflow:hidden;display:flex;align-items:center}.hero-copy{position:relative;z-index:1;width:68%}.hero h2{font-size:21px;line-height:1.13;margin:0 0 8px;color:#fff}.hero p{font-size:11px;line-height:1.45;color:#e3ebff;margin:0 0 11px}.hero .offer{font-size:11px;font-weight:850;letter-spacing:.4px}.hero-art{position:absolute;right:5px;bottom:0;font-size:78px;filter:drop-shadow(0 5px 5px #193f9b55);transform:rotate(-8deg)}.whitebtn{border:0;border-radius:9px;background:white;color:var(--blue2);padding:9px 12px;font-size:10px;font-weight:850;cursor:pointer}.location-search{display:flex;gap:8px;margin:17px 0 19px}.location{flex:1;border:1px solid #edf0f5;border-radius:13px;background:#fff;padding:11px 12px;color:#8994a6;font-size:11px;display:flex;align-items:center;gap:8px;min-width:0}.searchbtn{width:43px;border:0;border-radius:11px;background:var(--navy);color:#fff;font-size:19px;cursor:pointer}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:17px 0 11px}.sectionhead strong{font-size:14px;color:var(--navy)}.sectionhead button{border:0;background:none;color:#8490a3;font-size:10px;cursor:pointer}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.category{border:1px solid #edf0f4;background:#fff;border-radius:16px;min-height:98px;padding:11px 5px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:#536078;font-size:11px;box-shadow:0 3px 9px #1c2b4805}.category .emoji{font-size:30px}.category.featured{background:#24b354;color:#fff;border-color:#24b354;box-shadow:0 7px 15px #20ad5930}.category:focus-visible,.btn:focus-visible,button:focus-visible{outline:3px solid #9db8ff;outline-offset:2px}.service-list{display:grid;gap:10px}.service-card,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}.service-card{display:flex;align-items:center;gap:12px;cursor:pointer}.service-img{width:64px;height:57px;border-radius:12px;background:#edf3ff;display:grid;place-items:center;font-size:29px;flex-shrink:0}.service-card .desc{font-size:10px;color:var(--muted);margin-top:4px}.service-card strong{font-size:12px}.price{color:var(--blue);font-size:11px;font-weight:850;margin-left:auto;white-space:nowrap}.title{font-size:22px;line-height:1.2;margin:4px 0 8px;color:var(--navy);letter-spacing:-.5px}.sub{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 15px}.back{border:0;background:none;color:var(--blue);font-size:12px;font-weight:800;padding:0;margin:0 0 14px;cursor:pointer}.btn{width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:13px 15px;font-size:12px;font-weight:850;cursor:pointer;box-shadow:0 7px 16px #2864e82b}.btn.secondary{background:#edf3ff;color:var(--blue);box-shadow:none}.btnrow{display:flex;gap:9px;margin-top:12px}.btnrow .btn{flex:1}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:800;color:#43516a;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #e1e7f0;background:#fff;border-radius:11px;padding:12px;font:inherit;font-size:12px;color:var(--ink);outline:none}.field textarea{height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6e98ff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:11px;font-weight:800;cursor:pointer}.choice.selected{border-color:var(--blue);background:#f0f5ff;color:var(--blue)}.jobrow{display:flex;align-items:center;gap:11px}.jobicon{width:44px;height:44px;border-radius:13px;background:#edf3ff;display:grid;place-items:center;font-size:23px;flex-shrink:0}.jobtitle{font-size:12px;font-weight:850}.muted{font-size:10px;color:var(--muted);line-height:1.5}.pill{margin-left:auto;background:#eaf8f0;color:#16855f;padding:5px 8px;border-radius:20px;font-size:9px;font-weight:850;white-space:nowrap}.quick{display:flex;gap:8px;margin-top:12px}.quick button,.outline{border:1px solid #dce5f4;background:#fff;color:#315a9e;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:800;cursor:pointer}.progress{height:6px;border-radius:9px;background:#edf1f7;margin:15px 0 6px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);border-radius:9px}.profileline{width:100%;display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:#34425a;text-align:left;font-size:12px;cursor:pointer}.profileline b{color:#9aa5b5;font-size:17px}.avatar{width:43px;height:43px;border-radius:50%;background:#eaf0ff;color:#285bd0;display:grid;place-items:center;font-weight:850}.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:11px}.nav{position:absolute;z-index:10;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:4px}.nav button{width:25%;height:100%;border:0;background:none;color:#9aa5b5;font-size:9px;font-weight:750;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;cursor:pointer}.nav button b{font-size:19px;font-weight:500}.nav button.active{color:var(--blue)}.toast{position:absolute;z-index:15;bottom:81px;left:16px;right:16px;background:#142943;color:#fff;border-radius:12px;padding:12px 14px;font-size:11px;box-shadow:0 8px 25px #0c203d35;display:none}.toast.show{display:block;animation:fade 3s forwards}@keyframes fade{0%,78%{opacity:1}100%{opacity:0}}.stepdots{display:flex;gap:5px;margin:0 0 17px}.stepdots i{height:4px;flex:1;background:#e8edf5;border-radius:5px}.stepdots i.on{background:var(--blue)}.detail-banner{border-radius:17px;background:linear-gradient(120deg,#eaf1ff,#f6f8ff);padding:18px;text-align:center;font-size:45px;margin:8px 0 15px}.smallnote{font-size:9px;color:#8b97a9;text-align:center;margin-top:10px}
@media(max-width:430px){body{padding:0;background:#fff}.phone{width:100vw;height:100dvh;min-height:560px;border:0;border-radius:0;box-shadow:none}.phone:before{top:0}.phone:after{display:none}.app{height:calc(100% - 37px)}.status{padding-top:8px}.nav{padding-bottom:env(safe-area-inset-bottom);height:calc(70px + env(safe-area-inset-bottom))}.app{padding-bottom:calc(82px + env(safe-area-inset-bottom))}}
@media(min-width:431px) and (max-height:700px){.phone{height:94vh;min-height:0}}
</style></head>
<body><main class="stage"><div class="phone" aria-label="FixMate mobile application"><div class="status"><span>9:41</span><span class="sys">▴ ▮ ▰</span></div><header class="topbar"><div class="brand"><span class="logo">⌂</span><span>FixMate</span></div><div class="top-actions"><button class="round" data-action="notifications" aria-label="Notifications">♧</button><button class="round" data-action="profile" aria-label="Profile">☺</button></div></header><div class="app" id="app" aria-live="polite"></div><div class="toast" id="toast" role="status"></div><nav class="nav" aria-label="Main navigation"><button class="active" data-nav="home"><b>⌂</b>Home</button><button data-nav="services"><b>▦</b>Services</button><button data-nav="jobs"><b>▤</b>My Jobs</button><button data-nav="profile"><b>☺</b>Profile</button></nav></div></main>
<script>
(()=>{
'use strict';
const app=document.getElementById('app'),toastEl=document.getElementById('toast');
const services=[{name:'Repair',type:'General repairs',icon:'⚙️',desc:'Doors, shelves, drywall and everyday fixes',price:'From $45'},{name:'Plumber',type:'Plumbing',icon:'🚰',desc:'Leaks, faucets, drains and fixtures',price:'From $55'},{name:'Electrician',type:'Electrical',icon:'👷',desc:'Lighting, outlets and small electrical jobs',price:'From $65'},{name:'Cleaning',type:'Cleaning',icon:'🧹',desc:'Home cleaning and tidy-up services',price:'From $50'},{name:'Painting',type:'Painting',icon:'🖌️',desc:'Touch-ups, rooms and surfaces',price:'From $75'},{name:'Cooking',type:'Cooking',icon:'🍳',desc:'Meal preparation and kitchen help',price:'From $40'}];
const popular=[{name:'Faucet installation',type:'Plumbing',icon:'🚰',desc:'Install or replace a kitchen or bathroom faucet',price:'From $55'},{name:'Light fixture repair',type:'Electrical',icon:'💡',desc:'Repair or replace a light fixture',price:'From $65'},{name:'Wall painting',type:'Painting',icon:'🖌️',desc:'Refresh a room or wall',price:'From $75'}];
let page='home',stack=[],selectedService='Plumbing',bookingStep=1,booking={},jobs=[{id:'FM-1024',name:'Kitchen faucet repair',type:'Plumbing',icon:'🚰',date:'Nov 10, 2026',status:'In progress',progress:65,details:'Kitchen faucet is leaking and needs repair.',address:'125 Main Street',contact:'Jose Herrera'}],activeJob=jobs[0];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show')}
function setNav(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page||((page==='serviceDetail'||page==='book'||page==='bookingConfirm')&&b.dataset.nav==='services')||(['jobDetail','tracking'].includes(page)&&b.dataset.nav==='jobs')||(!['home','services','jobs','profile','serviceDetail','book','bookingConfirm','jobDetail','tracking','notifications'].includes(page)&&b.dataset.nav==='profile')))}
function go(id,push=true){if(push&&id!==page)stack.push(page);page=id;render();setNav();app.scrollTo({top:0,behavior:'smooth'})}
function back(){go(stack.pop()||'home',false)}
function head(title,sub=''){return `<button class="back" data-action="back">← Back</button><h1 class="title">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}`}
function serviceCards(items){return `<div class="service-list">${items.map((s,i)=>`<div class="service-card" role="button" tabindex="0" data-action="service" data-name="${esc(s.type)}"><div class="service-img">${s.icon}</div><div><strong>${s.name}</strong><div class="desc">${s.desc}</div></div><span class="price">${s.price}</span></div>`).join('')}</div>`}
function home(){return `<section class="page active"><div class="welcome"><div><h1>Welcome, Jose 👋</h1><p>Good to see you today</p></div><div class="avatar">J</div></div><div class="hero"><div class="hero-copy"><div class="offer">20% 🔥 TODAY'S SPECIAL!</div><h2>Home care made easy.</h2><p>Get a discount on your first service. Book trusted help today.</p><button class="whitebtn" data-action="book">Book a service →</button></div><div class="hero-art">🧑‍🔧</div></div><div class="location-search"><div class="location"><span>◎</span><span>All services available near you</span><span style="margin-left:auto">⚙</span></div><button class="searchbtn" data-action="search" aria-label="Search">⌕</button></div><div class="sectionhead"><strong>Categories</strong><button data-action="services">See All</button></div><div class="categories">${services.map((s,i)=>`<button class="category ${i===0?'featured':''}" data-action="service" data-name="${esc(s.type)}"><span class="emoji">${s.icon}</span><span>${s.name}</span></button>`).join('')}</div><div class="sectionhead"><strong>Popular Services</strong><button data-action="services">See All</button></div>${serviceCards(popular)}<div class="sectionhead"><strong>Recent activity</strong><button data-action="jobs">View all</button></div>${jobCard(jobs[0])}</section>`}
function servicesPage(){return `<section class="page active">${head('All Services','Choose a service category to see details and request a visit.') }<div class="categories">${services.map((s,i)=>`<button class="category ${i===0?'featured':''}" data-action="service" data-name="${esc(s.type)}"><span class="emoji">${s.icon}</span><span>${s.name}</span></button>`).join('')}</div><div class="sectionhead"><strong>Popular services</strong></div>${serviceCards(popular)}<button class="btn" data-action="book">Request a Service</button></section>`}
function detail(){let s=services.find(x=>x.type===selectedService)||popular.find(x=>x.type===selectedService)||services[0];return `<section class="page active">${head(s.name,'Professional home service, delivered by trusted local help.')}<div class="detail-banner">${s.icon}</div><div class="card"><strong>${s.name} services</strong><p class="sub" style="margin:7px 0 0">${s.desc}. Tell us what you need and choose a preferred date. We will confirm the details in this demo.</p><p class="price" style="margin-top:12px">${s.price}</p></div><div class="sectionhead"><strong>What we can help with</strong></div><div class="card muted">• Assessment and consultation<br>• Standard installation and repairs<br>• Maintenance and finishing work</div><button class="btn" data-action="book">Request this service</button></section>`}
function book(){return `<section class="page active">${head('Request a Service','Complete the details below to create your demo booking.')}<div class="stepdots"><i class="on"></i><i class="${bookingStep>=2?'on':''}"></i><i class="${bookingStep>=3?'on':''}"></i></div>${bookingStep===1?`<div class="field"><label>Choose a service</label><select id="serviceType">${services.map(s=>`<option ${s.type===selectedService?'selected':''}>${s.type}</option>`).join('')}<option>Other</option></select></div><div class="field"><label>Describe the work needed</label><textarea id="details" placeholder="Describe the issue or work you need...">${esc(booking.details||'')}</textarea></div><div class="field"><label>Preferred date</label><input id="date" type="date" value="${esc(booking.date||'')}" min="${new Date().toISOString().slice(0,10)}"></div><button class="btn" data-action="bookingNext">Continue</button>`:bookingStep===2?`<div class="field"><label>Service address</label><input id="address" placeholder="Street address, city, ZIP" value="${esc(booking.address||'')}"></div><div class="field"><label>Contact name</label><input id="contactName" placeholder="Your name" value="${esc(booking.contactName||'Jose Herrera')}"></div><div class="field"><label>Phone or email</label><input id="contact" placeholder="Phone number or email" value="${esc(booking.contact||'')}"></div><div class="btnrow"><button class="btn secondary" data-action="bookingBack">Back</button><button class="btn" data-action="bookingNext">Review</button></div>`:`<div class="card"><strong>Review your request</strong><p class="muted">${esc(booking.service)} · ${esc(booking.date||'Date to be confirmed')}</p><p class="muted">${esc(booking.details)}</p><p class="muted">${esc(booking.address)}</p><p class="muted">${esc(booking.contactName)} · ${esc(booking.contact)}</p></div><div class="btnrow"><button class="btn secondary" data-action="bookingBack">Edit</button><button class="btn" data-action="submitBooking">Confirm request</button></div>`}<p class="smallnote">Demo only — no information is sent.</p></section>`}
function jobCard(j){return `<div class="card"><div class="row"><div class="jobrow"><div class="jobicon">${j.icon||'🧰'}</div><div><div class="jobtitle">${esc(j.name)}</div><div class="muted">${esc(j.id)} · ${esc(j.date)}</div></div></div><span class="pill">${esc(j.status)}</span></div><div class="progress"><span style="width:${j.progress||25}%"></span></div><div class="row muted"><span>Request received</span><span>${j.progress>=65?'Technician assigned':'Awaiting confirmation'}</span></div><div class="quick"><button data-action="job" data-id="${esc(j.id)}">Job details</button><button data-action="track" data-id="${esc(j.id)}">Track request</button></div></div>`}
function jobsPage(){return `<section class="page active">${head('My Jobs','Your service requests and their latest updates.')}${jobs.length?jobs.map(jobCard).join(''):'<div class="empty">You have no service requests yet.</div>'}<div class="card"><strong class="jobtitle">Need another job done?</strong><p class="muted">Book a trusted professional whenever you need a hand.</p><button class="btn" data-action="book">Book a service</button></div></section>`}
function jobDetail(){let j=activeJob||jobs[0];return `<section class="page active">${head('Job Details',j.id)}<div class="card"><div class="jobrow"><div class="jobicon">${j.icon||'🧰'}</div><div><div class="jobtitle">${esc(j.name)}</div><div class="muted">${esc(j.id)} · ${esc(j.date)}</div></div><span class="pill">${esc(j.status)}</span></div><div class="progress"><span style="width:${j.progress||25}%"></span></div><p class="muted">${esc(j.details||'Service request submitted.')}</p><hr style="border:0;border-top:1px solid var(--line)"><p class="muted"><b>Service address</b><br>${esc(j.address||'To be confirmed')}</p><p class="muted"><b>Contact</b><br>${esc(j.contact||'On file')}</p></div><button class="btn" data-action="track" data-id="${esc(j.id)}">Track this request</button><div class="btnrow"><button class="btn secondary" data-action="help">Get help</button><button class="btn secondary" data-action="jobs">All jobs</button></div></section>`}
function tracking(){let j=activeJob||jobs[0];return `<section class="page active">${head('Track Request',j.id)}<div class="card"><div class="row"><strong class="jobtitle">${esc(j.name)}</strong><span class="pill">${esc(j.status)}</span></div><div class="progress"><span style="width:${j.progress||25}%"></span></div><div class="muted" style="line-height:2.1;margin-top:12px">✓ Request received<br>${j.progress>=40?'✓':'○'} Request reviewed<br>${j.progress>=65?'✓':'○'} Technician assigned<br>${j.progress>=100?'✓':'○'} Job completed</div></div><div class="card"><strong class="jobtitle">Latest update</strong><p class="muted">${j.progress>=65?'Your request is being prepared for service.':'Your request has been received. We will update this timeline as it progresses.'}</p></div><button class="btn secondary" data-action="job" data-id="${esc(j.id)}">Back to job details</button></section>`}
function profile(){return `<section class="page active">${head('My Profile')}<div class="card"><div class="jobrow"><div class="avatar">J</div><div><div class="jobtitle" style="font-size:15px">Jose Herrera</div><div class="muted">Customer account</div></div></div></div><div class="card" style="padding:4px 13px">${[['Personal information','personal'],['Saved addresses','addresses'],['Notifications','notifications'],['Help & support','support'],['Privacy & terms','privacy']].map(([label,id])=>`<button class="profileline" data-action="profilePage" data-page="${id}"><span>${label}</span><b>›</b></button>`).join('')}</div><button class="btn secondary" data-action="profilePage" data-page="settings">Account settings</button></section>`}
function profileSub(){let data={personal:['Personal Information','Jose Herrera · Customer account'],addresses:['Saved Addresses','No saved addresses yet. Add an address when requesting your next service.'],notifications:['Notifications','You are all caught up. Service updates will appear here.'],support:['Help & Support','For demo support, contact hello@fixmate.demo.'],privacy:['Privacy & Terms','This interactive prototype uses demo information only. No personal information is transmitted.'],settings:['Account Settings','Demo account settings and preferences.']};let d=data[page]||data.settings;return `<section class="page active">${head(d[0])}<div class="card"><strong class="jobtitle">${d[0]}</strong><p class="muted">${d[1]}</p>${page==='personal'?'<div class="field"><label>Name</label><input value="Jose Herrera"></div><div class="field"><label>Email</label><input placeholder="Add email address"></div>':''}${page==='addresses'?'<button class="btn" data-action="addAddress">Add address</button>':''}${page==='settings'?'<button class="btn secondary" data-action="notifications">Notification preferences</button>':''}</div></section>`}
function render(){let html={home,services:servicesPage,serviceDetail:detail,book,jobs:jobsPage,jobDetail,tracking,profile,...{personal:profileSub,addresses:profileSub,notifications:profileSub,support:profileSub,privacy:profileSub,settings:profileSub}};app.innerHTML=(html[page]||home)();}
function startBooking(){booking={};bookingStep=1;go('book')}
function captureBooking(){if(bookingStep===1){booking.service=document.getElementById('serviceType').value;booking.details=document.getElementById('details').value.trim();booking.date=document.getElementById('date').value;if(!booking.details){toast('Please describe the work you need.');return false}if(!booking.date){toast('Please choose a preferred date.');return false}selectedService=booking.service;bookingStep=2;render();return false}if(bookingStep===2){booking.address=document.getElementById('address').value.trim();booking.contactName=document.getElementById('contactName').value.trim();booking.contact=document.getElementById('contact').value.trim();if(!booking.address||!booking.contactName||!booking.contact){toast('Please complete your address and contact details.');return false}bookingStep=3;render();return false}return true}
function submitBooking(){let j={id:'FM-'+(1025+jobs.length-1),name:booking.service+' service request',type:booking.service,icon:(services.find(s=>s.type===booking.service)||{}).icon||'🧰',date:booking.date,status:'Received',progress:25,details:booking.details,address:booking.address,contact:booking.contactName+' · '+booking.contact};jobs.unshift(j);activeJob=j;bookingStep=1;booking={};toast('Your service request has been created.');go('jobs')}
function action(a,el){switch(a){case'back':back();break;case'home':case'services':case'jobs':case'profile':go(a);break;case'book':startBooking();break;case'service':selectedService=el.dataset.name;go('serviceDetail');break;case'bookingNext':captureBooking();break;case'bookingBack':bookingStep=Math.max(1,bookingStep-1);render();break;case'submitBooking':submitBooking();break;case'job':activeJob=jobs.find(j=>j.id===el.dataset.id)||jobs[0];go('jobDetail');break;case'track':activeJob=jobs.find(j=>j.id===el.dataset.id)||jobs[0];go('tracking');break;case'profilePage':go(el.dataset.page);break;case'notifications':go('notifications');break;case'search':go('services');toast('Choose a category to explore available services.');break;case'help':toast('Demo support: hello@fixmate.demo');break;case'addAddress':toast('Address form is available when you request a service.');break;}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}let el=e.target.closest('[data-action]');if(el){action(el.dataset.action,el);return}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.service-card[role="button"]')){e.preventDefault();selectedService=e.target.dataset.name;go('serviceDetail')}});
render();setNav();
})();
</script></body></html>
