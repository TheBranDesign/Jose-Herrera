<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17243a" />
  <title>FixMate | Mobile App Prototype</title>
  <style>
    :root {
      --navy: #17243a;
      --blue: #2459d8;
      --blue-dark: #204cae;
      --ink: #101d33;
      --muted: #7b8ba7;
      --line: #e1e8f2;
      --page: #edf1f7;
      --surface: #ffffff;
      --soft: #f5f8fc;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .phone {
      position: relative;
      width: min(390px, calc(100vw - 28px));
      height: min(780px, calc(100dvh - 28px));
      min-height: 620px;
      overflow: hidden;
      border: 8px solid var(--navy);
      border-radius: 43px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(22, 37, 62, .16), 0 3px 8px rgba(22,37,62,.08);
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 38px;
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 23px 0 24px;
      background: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -.2px;
    }
    .notch {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 116px;
      height: 22px;
      background: var(--navy);
      border-radius: 0 0 17px 17px;
    }
    .status-icons { display: flex; align-items: center; gap: 5px; }
    .signal { display: inline-flex; gap: 2px; align-items: end; height: 10px; }
    .signal i { display: block; width: 3px; background: var(--ink); border-radius: 2px; }
    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 10px; }
    .battery { width: 17px; height: 8px; border: 1.5px solid var(--ink); border-radius: 2px; position: relative; }
    .battery::before { content: ""; position: absolute; right: -3px; top: 1.5px; height: 3px; width: 2px; background: var(--ink); border-radius: 0 2px 2px 0; }
    .battery::after { content: ""; position: absolute; inset: 1px; width: 72%; background: var(--ink); border-radius: 1px; }
    .app-header {
      height: 71px;
      flex: 0 0 71px;
      padding: 0 19px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #f0f3f8;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 850; letter-spacing: -.7px; }
    .brand-mark {
      width: 35px; height: 35px; display: grid; place-items: center;
      color: white; background: linear-gradient(145deg, #2e6cf0, #174cc7);
      border-radius: 11px;
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .avatar { width: 35px; height: 35px; border-radius: 50%; display: grid; place-items: center; background: #eaf0ff; color: #2459d8; font-size: 14px; font-weight: 800; }
    .screen {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      background: var(--soft);
      padding: 17px 18px 16px;
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { display: none; }
    .greeting { color: #71819c; font-size: 13px; margin: 0 0 5px; }
    h1 { margin: 0; max-width: 285px; font-size: 23px; line-height: 1.16; letter-spacing: -.85px; font-weight: 850; }
    .hero {
      position: relative;
      min-height: 187px;
      margin-top: 15px;
      padding: 22px 19px 18px;
      overflow: hidden;
      color: white;
      border-radius: 21px;
      background: linear-gradient(118deg, #204ba9 0%, #2865e9 100%);
    }
    .hero-kicker { margin: 0 0 10px; color: #dce7ff; font-size: 13px; font-weight: 800; letter-spacing: -.1px; }
    .hero h2 { position: relative; z-index: 1; max-width: 245px; margin: 0 0 8px; font-size: 20px; line-height: 1.2; letter-spacing: -.5px; }
    .hero-copy { position: relative; z-index: 1; margin: 0 0 12px; color: #edf3ff; font-size: 11px; }
    .primary-btn { position: relative; z-index: 2; border: 0; border-radius: 10px; background: white; color: #174dbd; padding: 10px 14px; font-size: 11px; font-weight: 850; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,.08); }
    .hero-tool { position: absolute; right: 20px; bottom: 2px; width: 82px; height: 112px; opacity: .22; transform: rotate(-18deg); }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin: 21px 0 11px; }
    .section-head h3 { margin: 0; font-size: 14px; font-weight: 850; letter-spacing: -.2px; }
    .text-btn { border: 0; padding: 3px 0; background: transparent; color: #1454db; font-size: 11px; font-weight: 800; cursor: pointer; }
    .service-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .service {
      min-width: 0; height: 77px; border: 1px solid var(--line); border-radius: 15px;
      background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      cursor: pointer; transition: transform .15s, border-color .15s, background .15s;
    }
    .service:active { transform: scale(.97); }
    .service:hover, .service:focus-visible { border-color: #8eafff; background: #fafdff; outline: none; }
    .service .emoji { font-size: 25px; line-height: 1; filter: saturate(1.1); }
    .service span:last-child { font-size: 10px; font-weight: 750; }
    .activity-card { border: 1px solid var(--line); border-radius: 17px; background: white; padding: 14px 14px 13px; }
    .activity-top { display: flex; align-items: center; gap: 10px; }
    .activity-icon { flex: 0 0 43px; width: 43px; height: 43px; border-radius: 13px; background: #eaf1ff; display: grid; place-items: center; color: #1555d8; }
    .activity-icon svg { width: 25px; height: 25px; }
    .activity-info { min-width: 0; flex: 1; }
    .activity-info strong { display: block; font-size: 13px; line-height: 1.2; letter-spacing: -.2px; }
    .activity-info small { display: block; margin-top: 3px; color: #8290a8; font-size: 10px; white-space: nowrap; }
    .status { align-self: center; flex: 0 0 auto; border-radius: 20px; padding: 5px 8px; background: #e7f9f1; color: #13835b; font-size: 9px; font-weight: 800; }
    .activity-actions { display: flex; gap: 8px; margin-top: 12px; }
    .outline-btn { border: 1px solid #d7e2f5; border-radius: 10px; padding: 9px 12px; background: white; color: #174dbd; font-size: 10px; font-weight: 800; cursor: pointer; }
    .bottom-nav { flex: 0 0 66px; height: 66px; border-top: 1px solid #e5ebf4; background: white; display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px 8px 5px; }
    .nav-item { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8190aa; font-size: 9px; cursor: pointer; }
    .nav-item svg { width: 17px; height: 17px; stroke: currentColor; }
    .nav-item.active { color: #1655e5; }
    .toast { position: absolute; z-index: 10; left: 50%; bottom: 76px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; width: max-content; max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 12px; background: #17243a; color: #fff; font-size: 11px; font-weight: 650; box-shadow: 0 6px 20px #17243a35; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 420px) {
      body { padding: 0; background: #fff; }
      .phone { width: 100vw; height: 100dvh; min-height: 590px; border-width: 0; border-radius: 0; box-shadow: none; }
      .notch { border-radius: 0 0 15px 15px; }
    }
    @media (max-height: 700px) and (min-width: 421px) {
      .phone { height: calc(100dvh - 20px); min-height: 0; }
      .screen { padding-top: 12px; }
      .hero { min-height: 165px; margin-top: 11px; padding-top: 17px; }
      .section-head { margin-top: 15px; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="FixMate mobile application preview">
    <div class="notch" aria-hidden="true"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons" aria-hidden="true"><span>•••</span><span class="signal"><i></i><i></i><i></i><i></i></span><span class="battery"></span></span>
    </div>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4.5 11.2 12 4.8l7.5 6.4v7.1a1 1 0 0 1-1 1h-5v-5.1h-3v5.1h-5a1 1 0 0 1-1-1v-7.1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </span>
        <span>FixMate</span>
      </div>
      <div class="avatar" aria-label="Jose's profile">J</div>
    </header>

    <section class="screen">
      <p class="greeting">Good morning, Jose 👋</p>
      <h1>What can we fix<br />for you today?</h1>

      <section class="hero" aria-label="Book a home service">
        <p class="hero-kicker">YOUR HOME, IN GOOD HANDS</p>
        <h2>Reliable help is just a tap away.</h2>
        <p class="hero-copy">Book trusted help for the jobs around your home.</p>
        <button class="primary-btn" data-message="Let's get your service request started.">Request a service →</button>
        <svg class="hero-tool" viewBox="0 0 100 130" fill="none" aria-hidden="true">
          <path d="M70 8c-12-4-25 3-29 15-2 7 0 14 4 19L12 93a10 10 0 0 0 15 13l33-51c7 1 14-2 19-8 7-9 6-22-2-30l-13 17-12-7L70 8Z" stroke="#071f62" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m17 99 8 5" stroke="#071f62" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </section>

      <div class="section-head">
        <h3>Explore services</h3>
        <button class="text-btn" data-message="Showing all available home services.">See all</button>
      </div>
      <div class="service-grid" aria-label="Popular services">
        <button class="service" data-message="Plumbing services selected."><span class="emoji">🚿</span><span>Plumbing</span></button>
        <button class="service" data-message="Electrical services selected."><span class="emoji">💡</span><span>Electrical</span></button>
        <button class="service" data-message="Painting services selected."><span class="emoji">🖌️</span><span>Painting</span></button>
        <button class="service" data-message="Home repairs selected."><span class="emoji">🛠️</span><span>Repairs</span></button>
      </div>

      <div class="section-head">
        <h3>Recent activity</h3>
        <button class="text-btn" data-message="Opening your recent activity.">View all</button>
      </div>
      <article class="activity-card">
        <div class="activity-top">
          <div class="activity-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 4.5h14v15H5z" fill="#1555d8"/><path d="M9 8h6M12 8v4m0 0-2-2m2 2 2-2M8 16h8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 3h10" stroke="#1555d8" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <div class="activity-info">
            <strong>Kitchen faucet repair</strong>
            <small>Request #FM-1024 · Nov 10</small>
          </div>
          <span class="status">In progress</span>
        </div>
        <div class="activity-actions">
          <button class="outline-btn" data-message="Your faucet repair is currently in progress.">Track request</button>
          <button class="outline-btn" data-message="Request FM-1024 · Kitchen faucet repair.">Details</button>
        </div>
      </article>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-tab="Home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="m5 10 7-6 7 6v9H5z"/><path d="M10 19v-6h4v6"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="Services"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg><span>Services</span></button>
      <button class="nav-item" data-tab="My jobs"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h6"/></svg><span>My jobs</span></button>
      <button class="nav-item" data-tab="Profile"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 17c1-2 2.5-3 4.5-3s3.5 1 4.5 3"/></svg><span>Profile</span></button>
    </nav>
    <div class="toast" role="status" aria-live="polite"></div>
  </main>
  <script>
    const toast = document.querySelector('.toast');
    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    document.querySelectorAll('[data-message]').forEach(button => {
      button.addEventListener('click', () => showToast(button.dataset.message));
    });
    document.querySelectorAll('.nav-item').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(item => {
          item.classList.remove('active');
          item.removeAttribute('aria-current');
        });
        button.classList.add('active');
        button.setAttribute('aria-current', 'page');
        const tab = button.dataset.tab;
        showToast(tab === 'Home' ? 'You are on the home screen.' : `${tab} screen preview selected.`);
      });
    });
  </script>
</body>
</html>
